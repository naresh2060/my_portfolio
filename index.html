<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naresh Kushawaha - Portfolio</title>
    <meta name="description" content="Naresh Kushawaha - Social Media Manager & Content Strategist, building full-stack dev skills.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Using Syne for headings and Inter for body -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-content">
            <a href="#" class="logo" id="nav-logo">NARESH.K</a>
            <div class="desktop-menu">
                <a href="#about">About</a>
                <a href="#expertise">Expertise</a>
                <a href="#projects">Projects</a>
                <a href="#contact">Contact</a>
            </div>
            <div class="nav-controls">
                <button id="theme-toggle" aria-label="Toggle theme">
                    <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                    <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                </button>
                <button id="menu-toggle" aria-label="Toggle menu">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </button>
            </div>
        </div>
        <div class="mobile-menu" id="mobile-menu">
            <a href="#about">About</a>
            <a href="#expertise">Expertise</a>
            <a href="#projects">Projects</a>
            <a href="#contact">Contact</a>
        </div>
    </nav>

    <main>
        <section id="hero" class="hero">
            <h1 id="hero-name" class="hero-name"></h1>
            <h2 id="hero-title" class="hero-title"></h2>
            <p id="hero-description" class="hero-description"></p>
            <div class="hero-buttons">
                <a href="#projects" id="hero-btn-primary" class="btn btn-primary"></a>
                <a href="#contact" id="hero-btn-secondary" class="btn btn-outline"></a>
            </div>
        </section>

        <section id="about" class="about">
            <h2 id="about-title" class="section-title"></h2>
            <div id="about-content" class="about-content"></div>
        </section>

        <section id="expertise" class="expertise">
            <h2 id="expertise-title" class="section-title"></h2>
            <div id="expertise-cards" class="expertise-grid"></div>
        </section>
        
        <section id="projects" class="projects">
            <h2 id="projects-title" class="section-title"></h2>
            <div id="projects-list" class="projects-grid"></div>
        </section>

        <section id="contact" class="contact">
            <h2 id="contact-title" class="section-title"></h2>
            <a id="contact-btn" href="#" class="btn btn-primary btn-large"></a>
            <div style="margin-top: 1.5rem;">
                <a id="contact-phone" href="#" style="color: var(--text-secondary); font-size: 1.1rem; font-weight: 500; transition: color 0.2s ease;"></a>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="footer-logo" id="footer-logo"></div>
        <div class="footer-socials" id="footer-socials"></div>
        <div class="footer-copyright" id="footer-copyright"></div>
    </footer>

    <!-- Feather Icons for the expertise sections -->
    <script src="https://unpkg.com/feather-icons"></script>
    <script src="content.js"></script>
    <script src="script.js"></script>
</body>
</html>
